<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Cara de la mascota</title>
<body style="font-family:sans-serif;margin:16px">
<h2>Cara de la mascota: estilo B (boceto)</h2>
<p class="subtitle">Sigue siendo 128×64 real en blanco y negro. Ojos lisos, párpados, mirada y rebote.</p>
<div id="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px"></div>
<script src="cara.js"></script>
<script>
(() => {
  const grid = document.getElementById('grid');
  const shown = Object.entries(PetFace.faces).map(([key, face]) => {
    const f = document.createElement('figure'); f.style.margin = '0';
    const c = document.createElement('canvas'); c.width = 128; c.height = 64;
    c.style.cssText = 'width:100%;image-rendering:pixelated;background:#000;border:6px solid #222;border-radius:6px';
    c.setAttribute('role', 'img'); c.setAttribute('aria-label', face.label);
    const t = document.createElement('figcaption'), name = document.createElement('strong');
    name.textContent = face.label; t.append(name);
    f.append(c, t); grid.append(f);
    return { c, key };
  });
  const frame = t => {
    for (const { c, key } of shown) PetFace.draw(c, key, t);
    if (!PetFace.still) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
