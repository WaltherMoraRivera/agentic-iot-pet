name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gradle:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build Android, Windows, and simulator
        shell: pwsh
        run: .\gradlew.bat :androidApp:assembleDebug :desktopApp:compileKotlin :simulator:test :shared:desktopTest :simulator:run --console=plain
