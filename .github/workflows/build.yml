name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gradle:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build Android, Windows, and simulator
        shell: pwsh
        run: .\gradlew.bat :androidApp:assembleDebug :desktopApp:compileKotlin :simulator:test :shared:desktopTest :simulator:run --console=plain

  firmware:
    # Official Espressif image with the same ESP-IDF version as the local environments.
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        project:
          - firmware
          - firmware/test
          - firmware/diagnostics/h01
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build ${{ matrix.project }} for esp32s3
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C "${{ matrix.project }}" build
          idf.py -C "${{ matrix.project }}" size
